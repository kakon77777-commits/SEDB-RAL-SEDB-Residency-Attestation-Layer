name: Phase 3A synthetic registrar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phase3a:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run Phase 3A tests
        run: >-
          python -m pytest -q
          tests/test_phase3_registration_prepare.py
          tests/test_phase3_schema_assets.py
          tests/test_phase3_registration_admission.py
          tests/test_phase3_registrar_plan.py
          tests/test_phase3_registrar_recovery.py
          tests/test_phase3_cli.py
          tests/test_phase3a_gate.py

      - name: Generate synthetic acceptance evidence
        run: >-
          python scripts/validate_phase3a.py
          --output phase3a-${{ runner.os }}.json

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v7
        with:
          name: phase3a-${{ runner.os }}
          path: phase3a-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 14
