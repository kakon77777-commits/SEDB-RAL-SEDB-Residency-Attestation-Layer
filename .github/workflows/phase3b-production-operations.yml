name: Phase 3B-B production operations layout

on:
  push:
    branches: [docs/phase3b-b-production-operations-layout, main]
  pull_request:

permissions:
  contents: read

jobs:
  production-operations:
    name: production operations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python floor
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run R3B-B focused and legacy-boundary tests
        run: >-
          python -m pytest -q
          tests/test_production_operations_contracts.py
          tests/test_production_operations_layout.py
          tests/test_production_operations_recovery.py
          tests/test_production_operations_cli.py
          tests/test_production_operations_acl_script.py
          tests/test_production_operations_acl_windows.py
          tests/test_production_operations_acceptance.py
          tests/test_production_operations_packaging.py
          tests/test_registry_root.py
          tests/test_registry_recovery.py
          tests/test_phase3a_operations_workspace.py
          tests/test_phase3a_operations_gate.py

      - name: Compile source
        run: python -m compileall -q src

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Verify installed version and contract resource
        run: >-
          python -c "from importlib.resources import files; import sedb_ral; assert sedb_ral.__version__ == '0.5.0b1'; assert files('sedb_ral.schemas').joinpath('production-operations-extension-plan.schema.json').is_file()"

      - name: Generate deterministic R3B-B evidence
        run: >-
          python scripts/validate_production_operations.py
          --output r3b-b-${{ runner.os }}.json

      - name: Upload R3B-B evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r3b-b-${{ runner.os }}
          path: r3b-b-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 14
