name: Phase 3B-A synthetic registrar operations

on:
  push:
    branches: [feat/phase3b-a-operations-rebased]
  pull_request:

permissions:
  contents: read

jobs:
  operations:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests -k phase3a_operations
      - run: python scripts/validate_phase3a_operations.py --output phase3a-operations-${{ runner.os }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase3a-operations-${{ runner.os }}
          path: phase3a-operations-${{ runner.os }}.json
          if-no-files-found: error
